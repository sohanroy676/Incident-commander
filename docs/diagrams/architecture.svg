<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">Incident Commander architecture</title>
  <desc id="d">An alert flows through receive, propose, investigate, classify, approve, execute, verify and postmortem steps inside the frozen incident_commander package. The ic_plus package wraps it and imports it; the reverse never happens. The ic_hub package is proposed.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#ffffff"/>

  <!-- ic_plus -->
  <rect x="20" y="20" width="860" height="440" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="36" y="44" font-weight="bold" fill="#3730a3">ic_plus (extension): LLM narrator / explainer / advisor, guard, CLI approver, extra scenarios</text>

  <!-- core -->
  <rect x="40" y="62" width="820" height="378" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="56" y="86" font-weight="bold" fill="#166534">incident_commander (graded build, frozen at v1.0): stdlib + scikit-learn, no env vars, no network</text>

  <!-- row 1 -->
  <g fill="#ffffff" stroke="#374151" stroke-width="1.2">
    <rect x="60" y="110" width="150" height="56" rx="6"/>
    <rect x="250" y="110" width="150" height="56" rx="6"/>
    <rect x="440" y="110" width="150" height="56" rx="6"/>
    <rect x="630" y="110" width="200" height="56" rx="6"/>
  </g>
  <g fill="#111827" text-anchor="middle">
    <text x="135" y="133">1. Receive</text><text x="135" y="152" font-size="11">alert, new Case</text>
    <text x="325" y="133">2. Propose</text><text x="325" y="152" font-size="11">BM25 + TF-IDF, RRF</text>
    <text x="515" y="133">3. Investigate</text><text x="515" y="152" font-size="11">4 rounds, 3-valued predicates</text>
    <text x="730" y="133">4. Classify</text><text x="730" y="152" font-size="11">action to tier, never severity</text>
  </g>
  <g stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M210 138 H248"/><path d="M400 138 H438"/><path d="M590 138 H628"/>
  </g>

  <!-- row 2 -->
  <g fill="#ffffff" stroke="#374151" stroke-width="1.2">
    <rect x="630" y="230" width="200" height="56" rx="6"/>
    <rect x="440" y="230" width="150" height="56" rx="6"/>
    <rect x="250" y="230" width="150" height="56" rx="6"/>
    <rect x="60" y="230" width="150" height="56" rx="6"/>
  </g>
  <g fill="#111827" text-anchor="middle">
    <text x="730" y="253">5. Approve</text><text x="730" y="272" font-size="11">page, deadline, escalate, token</text>
    <text x="515" y="253">6. Execute</text><text x="515" y="272" font-size="11">idempotent ledger</text>
    <text x="325" y="253">7. Verify</text><text x="325" y="272" font-size="11">re-query the alert's metric</text>
    <text x="135" y="253">8. Postmortem</text><text x="135" y="272" font-size="11">draft only; publish() is explicit</text>
  </g>
  <g stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M730 166 V228"/><path d="M630 258 H592"/><path d="M440 258 H402"/><path d="M250 258 H212"/>
  </g>

  <!-- handoff -->
  <rect x="250" y="350" width="340" height="64" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
  <text x="420" y="376" text-anchor="middle" fill="#9a3412">Hand off to a human with evidence</text>
  <text x="420" y="396" text-anchor="middle" font-size="11" fill="#9a3412">no confident match, no approval token, or fix reopened</text>
  <g stroke="#ea580c" stroke-width="1.2" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)">
    <path d="M515 166 V198 H230 V382 H248"/><path d="M730 286 V320 H540 V348"/><path d="M325 286 V348"/>
  </g>

  <!-- trace -->
  <rect x="60" y="350" width="150" height="64" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.2"/>
  <text x="135" y="376" text-anchor="middle" fill="#111827">Append-only Trace</text>
  <text x="135" y="396" text-anchor="middle" font-size="11" fill="#111827">commander.py only</text>

  <!-- dependency direction -->
  <text x="20" y="486" font-weight="bold" fill="#111827">Dependency direction</text>
  <text x="20" y="506" fill="#374151">ic_plus imports incident_commander; the reverse never happens (gate G1, "purity").</text>

  <!-- ic_hub -->
  <rect x="20" y="520" width="860" height="30" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-dasharray="6 4"/>
  <text x="36" y="540" fill="#4b5563">ic_hub (PROPOSED, not built): stdlib web hub on 127.0.0.1; imports both packages, imported by neither</text>
</svg>
