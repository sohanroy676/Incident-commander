# CI: lint, format check, unit tests and Definition-of-Done gates.
# Runs on every push and PR to main, and manually via workflow_dispatch.
# The slow real-clock suites run as parallel jobs; no test patches sleep.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      # Lenient config; incident_commander/ is excluded (frozen, not fully annotated).
      # Informational: 13 known errors in ic_plus (v2.1 baseline) are not fixed in a docs/CI release.
      - name: Type check (extension only, informational)
        continue-on-error: true
        run: mypy ic_plus

      # Fails on high severity only. Known baseline (not fixed here): B310 llm_client.py (urlopen on the
      # configured LLM URL), B404/B603 dod.py (subprocess with a fixed argument list).
      - name: Security scan (bandit, high severity)
        run: bandit -q -lll -r incident_commander ic_plus -c pyproject.toml

      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Unit tests (graded build, with coverage)
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report

  tests-plus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # The extension tests run whenever tests_plus/ exists (since v1.1).
      - name: Unit tests (extension, with coverage)
        if: hashFiles('tests_plus/**') != ''
        run: |
          coverage run -m unittest discover -s tests_plus -v
          coverage report

  dod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Definition-of-Done gates (G1-G6)
        run: python -m incident_commander.dod all
