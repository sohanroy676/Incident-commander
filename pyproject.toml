[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-commander"
version = "2.0.0"
description = "A deterministic incident-response agent over simulated data, with an optional LLM extension that never decides."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
incident-commander = "incident_commander.__main__:main"
ic-plus = "ic_plus.__main__:main"
ic-hub = "ic_hub.__main__:main"

[tool.setuptools]
packages = ["incident_commander", "incident_commander.fixtures", "ic_plus", "ic_hub"]

[tool.setuptools.package-data]
ic_hub = ["static/*"]

# requirements.txt stays the single source of the scikit-learn pin.
[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.coverage.run]
source = ["incident_commander", "ic_plus", "ic_hub"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

# Lenient on purpose; the graded package is frozen and not fully annotated.
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = false
exclude = ["^incident_commander/", "^tests/", "^tests_plus/", "^tests_hub/"]

[tool.bandit]
exclude_dirs = ["tests", "tests_plus", "tests_hub", ".venv"]
